<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet"
          th:href="@{/css/styles.css}">
</head>
<body>
<main class="container">
    <div class="form-container">
        <h1>Register</h1>
        <p class="subtitle">
            Create an account to use the Task Tracker.
        </p>
        <p class="error-message"
           th:if="${error}"
           th:text="${error}">
        </p>
        <form class="task-form"
              th:action="@{/register}"
              method="post">
            <div class="form-group">
                <label for="username">
                    Username
                </label>
                <input type="text"
                       id="username"
                       name="username"
                       required>
            </div>
            <div class="form-group">
                <label for="password">
                    Password
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       required>
            </div>
            <button class="button"
                    type="submit">
                Register
            </button>
        </form>
        <p>
            Already have an account?
            <a th:href="@{/login}">
                Login
            </a>
        </p>
    </div>
</main>
</body>
</html>
