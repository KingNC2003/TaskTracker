<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet"
          th:href="@{/css/styles.css}">
</head>
<body>
<main class="container">
    <div class="form-container">
        <h1>Login</h1>
        <p class="subtitle">
            Sign in to access your tasks.
        </p>
        <p class="error-message"
           th:if="${param.error}">
            Invalid username or password.
        </p>
        <p class="success-message"
           th:if="${param.registered}">
            Registration successful. You can now log in.
        </p>
        <p class="success-message"
           th:if="${param.logout}">
            You have been logged out.
        </p>
        <form class="task-form"
              th:action="@{/login}"
              method="post">
            <div class="form-group">
                <label for="username">
                    Username
                </label>
                <input type="text"
                       id="username"
                       name="username"
                       required>
            </div>
            <div class="form-group">
                <label for="password">
                    Password
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       required>
            </div>
            <button class="button"
                    type="submit">
                Login
            </button>
        </form>
        <p>
            Don't have an account?
            <a th:href="@{/register}">
                Register
            </a>
        </p>
    </div>
</main>
</body>
</html>
