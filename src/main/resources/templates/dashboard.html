<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Task Dashboard</title>
</head>

<body>
<main class="container">
    <div class="page-header">
        <div>
            <h1>Task Dashboard</h1>
            <p class="subtitle">Manage your tasks and deadlines.</p>
        </div>

        <a class="button" th:href="@{/tasks/new}">Create Task</a>
        <form th:action="@{/logout}" method="post">
            <button class="button button-secondary" type="submit">
                Logout
            </button>
        </form>
    </div>

    <div class="weather-card"
        th:if="${weather != null}">

        <h2>Current Weather</h2>

        <p>
            <strong>Location:</strong>
            <span th:text="${weather.name}"></span>
        </p>

        <p>
            <strong>Temperature:</strong>
            <span th:text="${weather.main.temp}"></span> °F
        </p>

        <p th:if="${weather.weather != null and !weather.weather.isEmpty()}">
            <strong>Conditions:</strong>
            <span th:text="${weather.weather[0].description}"></span>
        </p>

    </div>
    <div class="weather-card"
        th:if="${weather == null}">

        <h2>Current Weather</h2>
        <p>Weather information is currently unavailable.</p>

    </div>
    
    <form class="filter-form"
        th:action="@{/tasks}"
        method="get">

        <div class="filter-group">
            <label for="search">Search</label>

            <input type="text"
                id="search"
                name="search"
                placeholder="Search tasks..."
                th:value="${search}">
        </div>

        <div class="filter-group">
            <label for="status">Status</label>

            <select id="status"
                    name="status">

                <option value="">All</option>

                <option value="PENDING"
                        th:selected="${selectedStatus != null and selectedStatus.name() == 'PENDING'}">
                    Pending
                </option>

                <option value="COMPLETED"
                        th:selected="${selectedStatus != null and selectedStatus.name() == 'COMPLETED'}">
                    Completed
                </option>

            </select>
        </div>

        <div class="filter-group">
            <label for="priority">Priority</label>

            <select id="priority"
                    name="priority">

                <option value="">All</option>

                <option value="LOW"
                        th:selected="${selectedPriority != null and selectedPriority.name() == 'LOW'}">
                    Low
                </option>

                <option value="MEDIUM"
                        th:selected="${selectedPriority != null and selectedPriority.name() == 'MEDIUM'}">
                    Medium
                </option>

                <option value="HIGH"
                        th:selected="${selectedPriority != null and selectedPriority.name() == 'HIGH'}">
                    High
                </option>

            </select>
        </div>
        <button class="button"
                type="submit">
            Filter
        </button>

        <a class="button button-secondary"
        th:href="@{/tasks}">
            Clear
        </a>
    </form>

    <div class="alert alert-success"
     th:if="${successMessage}"
     th:text="${successMessage}">
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(tasks)}">
        <p>No tasks available.</p>
    </div>

    <div class="task-grid">
        <article class="task-card"
                 th:each="task : ${tasks}">

            <h2 th:text="${task.title}"></h2>

            <p class="task-description"
               th:text="${task.description}">
            </p>

            <div class="task-details">
                <p>
                    <strong>Due:</strong>
                    <span th:text="${task.dueDate}"></span>
                </p>

                <p>
                    <strong>Created:</strong>
                    <span th:text="${task.createdAt}"></span>
                </p>

                <p>
                    <strong>Priority:</strong>
                    <span th:text="${task.priority}"></span>
                </p>

                <p>
                    <strong>Status:</strong>
                    <span th:text="${task.status}"></span>
                </p>

                <a class="button"
                    th:href="@{/tasks/{id}/edit(id=${task.id})}">
                    Edit
                </a>

                <form th:action="@{/tasks/{id}/delete(id=${task.id})}"
                      method="post">
                    <button class="button button-danger"
                            type="submit">
                        Delete
                    </button>

                </form>
            </div>
        </article>
    </div>
    <nav class="pagination"
        th:if="${totalPages > 1}">
        <a class="button button-secondary"
        th:if="${currentPage > 1}"
        th:href="@{/tasks(
                page=${currentPage - 1},
                search=${search},
                status=${selectedStatus},
                priority=${selectedPriority}
        )}">
            Previous
        </a>
        <span>
            Page
            <strong th:text="${currentPage}"></strong>
            of
            <strong th:text="${totalPages}"></strong>
        </span>
        <a class="button"
        th:if="${currentPage < totalPages}"
        th:href="@{/tasks(
                page=${currentPage + 1},
                search=${search},
                status=${selectedStatus},
                priority=${selectedPriority}
        )}">
            Next
        </a>
    </nav>
</main>
</body>
</html>
